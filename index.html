<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ✅ Basic Meta Setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>IntelleQacademy | Software Training & Internships for Future Tech Leaders</title>

    <!-- ✅ Primary Meta Description -->
    <meta name="description" content="Join IntelleQacademy for hands-on software training in MERN Stack, Data Science, AI, Cyber Security, and DevOps. Learn through live projects, get internship experience, and receive placement assistance to launch your career." />

    <!-- ✅ SEO Keywords -->
    <meta name="keywords" content="software training, coding bootcamp, MERN stack, data science, AI training, cyber security, DevOps, full stack developer, internship, placement assistance, tech education, IntelleQacademy" />

    <!-- ✅ Canonical URL -->
    <link rel="canonical" href="https://intelleqacademy.com/" />

    <!-- ✅ Open Graph (Facebook, LinkedIn) -->
    <meta property="og:title" content="IntelleQacademy - Empowering Future Tech Leaders with Real-World Skills" />
    <meta property="og:description" content="Master industry-demanded technologies with live training, expert mentorship, and internship opportunities at IntelleQacademy." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://intelleqacademy.com/" />
    <meta property="og:image" content="https://intelleqacademy.com/og-image.jpg" /> <!-- Replace with your actual image -->

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IntelleQacademy - Professional Software Training & Internships" />
    <meta name="twitter:description" content="Live training, real projects, internship programs, and job placement support. Learn MERN, AI, Data Science, and more." />
    <meta name="twitter:image" content="https://intelleqacademy.com/og-image.jpg" />

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" href="/2.png" />

    <!-- ✅ Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- ✅ Structured Data (Google Rich Snippets) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "IntelleQacademy",
        "url": "https://intelleqacademy.com",
        "logo": "https://intelleqacademy.com/logo.png",
        "sameAs": [
          "https://www.linkedin.com/company/intelleqacademy",
          "https://twitter.com/intelleqacademy",
          "https://www.instagram.com/intelleqacademy"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-XXXXXXXXXX",
          "contactType": "Customer Support",
          "areaServed": "IN"
        }
      }
    </script>

    <!-- ✅ Robots & Indexing -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- ✅ Preload important assets -->
    <link rel="preload" as="image" href="https://intelleqacademy.com/banner.jpg" />
    <link rel="preload" as="script" href="/src/main.tsx" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
